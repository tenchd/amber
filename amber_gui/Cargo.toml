[package]
name = "amber_gui"
version = "0.1.0"
authors = ["David Tench <dtench@pm.me>"]
edition = "2024"
license = "MIT OR Apache-2.0"
include = ["LICENSE-APACHE", "LICENSE-MIT", "**/*.rs", "Cargo.toml"]
rust-version = "1.95"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
egui = "0.36.0"
eframe = { version = "0.36.0" }
amber_core = { path = "../amber_core" }

egui-file-dialog = "0.15.0"
chrono = "0.4.45"
serde_json = "1.0.151"
hex_fmt = "0.3.0"
egui_extras = { version = "0.36.0", features = ["all_loaders", "image"] }
image = { version = "0.25.10", features = ["png"] }

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.8"




